# Local dev and CI ("staging") stack. Production adds compose.prod.yml:
#   docker compose -f compose.yml -f compose.prod.yml up -d
name: nexus-ai

x-backend: &backend
  build: { context: ./backend }
  image: nexus-ai/backend:dev
  env_file: [.env]
  environment: &backend-env
    # Container-internal addresses override the localhost values in .env.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}
    QDRANT_URL: http://qdrant:6333
    # Uploaded files; api and worker share the `uploads` volume.
    UPLOADS_DIR: /data/uploads
    # Every request reaches the api through Caddy, which sets X-Forwarded-For (core/net.py).
    TRUSTED_PROXY: "true"
  # The image already runs as a non-root user; these take away what it never needs.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# api and worker start only after the one-shot migrate service has finished successfully.
x-backend-app: &backend-app
  <<: *backend
  depends_on:
    migrate: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    qdrant: { condition: service_healthy }

services:
  postgres:
    # pgvector image: the LangGraph memory store index needs the extension (TASK-025).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      # PG18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: ["qdrant_data:/qdrant/storage"]
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    healthcheck:
      # The image ships no curl/wget; open the port with bash instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    # One-shot: alembic upgrade head + LangGraph checkpointer/store setup. Idempotent.
    <<: *backend
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }  # it creates the document collection

  api:
    <<: *backend-app
    # `stop_grace_period` lets in-flight chat runs drain on deploy (ADR-0006: 90 s wait + margin).
    stop_grace_period: 120s
    volumes: ["uploads:/data/uploads"]
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    healthcheck:
      # Liveness only: dependency state is /readyz's job, and must not flap the container.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend-app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 120s
    # The worker parses uploaded files (LLM-T12): a hostile file may use up its memory or spawn
    # processes, but not the whole VM's.
    mem_limit: 2g
    pids_limit: 512
    volumes: ["uploads:/data/uploads"]
    healthcheck:
      # The worker touches this file every 10 s.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker-alive -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: nexus-ai/web:dev
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    # Runs as a non-root user: allow it to bind :80/:443 inside its own network namespace.
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  qdrant_data:
  uploads:
  caddy_data:
  caddy_config:
