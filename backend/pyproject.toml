[project]
name = "nexus-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "schemathesis>=4.33.4",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-0005: provider clients are created only in app/llm/factory.py.
"openai.OpenAI".msg = "Create model clients through app.llm.factory.get_model (ADR-0005)."
"openai.AsyncOpenAI".msg = "Create model clients through app.llm.factory.get_model (ADR-0005)."
"langchain_openai.ChatOpenAI".msg = "Create model clients through app.llm.factory.get_model (ADR-0005)."
"langchain_openai.OpenAIEmbeddings".msg = "Create embedding clients through app.llm.factory (ADR-0005)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "TID251"]
"app/llm/factory.py" = ["TID251"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # `evals` (the eval suite) is imported by tests/evals
markers = ["integration: needs postgres and qdrant running"]

[tool.coverage.run]
source = ["app", "evals"]
branch = true

[tool.coverage.report]
show_missing = true
