# Hooks use the versions pinned in the lockfiles (ruff via uv, prettier via npm) so local,
# pre-commit and CI always agree. Install once: `make hooks`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix "${@/#backend\//}"' --
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@/#backend\//}"' --
        language: system
        types: [python]
        files: ^backend/
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@/#frontend\//}"' --
        language: system
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|AGENTS\.md)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
